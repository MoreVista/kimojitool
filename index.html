<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>奇文字生成・復号ツール</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <h2>奇文字生成・復号ツール</h2>
    <br>
    <input type="text" id="inputText" placeholder="文字を入力">
    <button type="button" id="encodeButton">平文⇒奇文字</button>
    <button type="button" id="decodeButton">奇文字⇒平文</button>
    <p>変換結果: <span id="outputText"></span></p>
    <button type="button" id="copyButton">コピー</button>
    <br>
    <label>
        <input type="checkbox" id="retryToggle" checked> ランダム生成
    </label>
    <br>
    <label>
        <input type="checkbox" id="ignoreInvalidToggle"> 表示できない文字も含める
    </label>

    <script src="js/script.js"></script>
</body>
</html>
